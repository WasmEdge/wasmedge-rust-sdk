name: Publish Async API Documents

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      wasmedge_version:
        description: "Version of WasmEdge"
        required: true
        type: string
      dry_run:
        description: "Build the documentation without deploying it"
        required: true
        default: true
        type: boolean

jobs:
  release_wasmedge_sdk:
    name: Release wasmedge-sdk crate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    container:
      image: wasmedge/wasmedge:ubuntu-build-clang

    steps:
      - name: Checkout WasmEdge Rust SDK
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up build environment
        run: |
          apt update
          apt install -y software-properties-common libboost-all-dev ninja-build
          apt install -y llvm-15-dev liblld-15-dev

      - name: Install WasmEdge
        env:
          WASMEDGE_VERSION: ${{ inputs.wasmedge_version }}
        run: |
          curl -sSfL --retry 3 --output /tmp/wasmedge-install.sh \
            https://raw.githubusercontent.com/WasmEdge/WasmEdge/master/utils/install_v2.sh
          bash /tmp/wasmedge-install.sh -v "${WASMEDGE_VERSION}" -p /usr/local
          ldconfig
          /usr/local/bin/wasmedge --version

      # docsrs cfg enables the unstable doc_cfg feature in wasmedge-sys.
      - name: Install Rust-nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Build Async API document
        run: |
          RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc -p wasmedge-sdk --workspace --no-deps --features aot,async,wasi_crypto,wasi_nn,wasmedge_process,ffi --target-dir=./target

      - name: Upload Async API document
        if: github.ref == 'refs/heads/main' && inputs.dry_run == false
        uses: actions/upload-artifact@v7
        with:
          name: wasmedge-sdk-async-api-docs
          path: target/doc
          if-no-files-found: error

  deploy_async_api_document:
    name: Deploy Async API document
    if: github.ref == 'refs/heads/main' && inputs.dry_run == false
    needs: release_wasmedge_sdk
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download Async API document
        uses: actions/download-artifact@v8
        with:
          name: wasmedge-sdk-async-api-docs
          path: target/doc

      - name: Deploy Async API document
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/doc
          force_orphan: true
