name: Upstream canary (WasmEdge development HEAD)

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # .rustfmt.toml relies on nightly-only options (imports_granularity,
  # group_imports, ...) that stable rustfmt silently ignores.
  RUSTFMT_TOOLCHAIN: "nightly-2026-07-16"

# Every other workflow builds against a released WasmEdge. This one checks out
# the WasmEdge repository without a ref, so it builds the runtime's development
# HEAD and catches upstream C API breakage before it reaches a release.
#
# It is deliberately not attached to push or pull_request: the extra full
# WasmEdge build would roughly double PR turnaround, and an upstream breakage
# would then block changes that have nothing to do with it.
on:
  schedule:
    # Mondays, 03:00 UTC.
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  build_ubuntu:
    name: Ubuntu
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        rust: [stable]
    container:
      image: wasmedge/wasmedge:ubuntu-build-clang

    steps:
      - name: Checkout WasmEdge Rust SDK
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout WasmEdge Runtime
        uses: actions/checkout@v7
        with:
          repository: WasmEdge/WasmEdge
          path: WasmEdge

      - name: Build WasmEdge with Release mode
        working-directory: WasmEdge
        run: |
          apt update
          apt install -y software-properties-common libboost-all-dev llvm-15-dev liblld-15-dev ninja-build libssl-dev
          cmake -Bbuild -GNinja -DCMAKE_BUILD_TYPE=Release -DWASMEDGE_PLUGIN_PROCESS=On -DWASMEDGE_PLUGIN_WASI_CRYPTO=On .
          cmake --build build
          cmake --install build
          ldconfig

      - name: Install Rust-stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          toolchain: ${{ matrix.rust }}

      - name: Rustfmt
        run: |
          rustup toolchain install ${{ env.RUSTFMT_TOOLCHAIN }} --profile minimal --component rustfmt
          cargo +${{ env.RUSTFMT_TOOLCHAIN }} fmt --all -- --check

      - name: Clippy check
        run: |
          cargo clippy -V
          cargo clippy --lib --examples --features aot,wasi_nn,wasmedge_process,ffi -- -D warnings

      - name: Clippy check for async feature
        run: |
          cargo clippy -V
          cargo clippy --lib --examples --features aot,async,wasi_nn,wasmedge_process,ffi -- -D warnings

      - name: Build Async-Hello for Testing
        working-directory: examples/wasmedge-sys
        run: |
          rustup target add wasm32-wasip1
          rustc async_hello.rs --target=wasm32-wasip1 -o async_hello.wasm
          rustc hello.rs --target=wasm32-wasip1 -o hello.wasm

      - name: Test Rust SDK
        run: |
          cargo test --workspace --locked --features aot,wasmedge_process,ffi -- --nocapture --test-threads=1

      - name: Test Rust SDK with async feature
        run: |
          cargo test --workspace --locked --features aot,async,wasmedge_process,ffi -- --nocapture --test-threads=1

  build_macos:
    name: macOS arm64
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15]
        rust: [stable]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout WasmEdge Runtime
        uses: actions/checkout@v7
        with:
          repository: WasmEdge/WasmEdge
          path: WasmEdge

      - name: Install build tools
        run: brew install llvm ninja boost cmake

      - name: Build WasmEdge with Release mode
        working-directory: WasmEdge
        run: |
          export LLVM_DIR="$(brew --prefix llvm)/lib/cmake/llvm"
          export CC=clang
          export CXX=clang++
          rm -rf build
          cmake -Bbuild -GNinja -DCMAKE_BUILD_TYPE=Release .
          cmake --build build
          cmake --install build

      - name: Install Rust-stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          toolchain: ${{ matrix.rust }}

      - name: Run cargo fmt
        run: |
          rustup toolchain install ${{ env.RUSTFMT_TOOLCHAIN }} --profile minimal --component rustfmt
          cargo +${{ env.RUSTFMT_TOOLCHAIN }} fmt --all -- --check

      - name: Clippy
        run: |
          cargo clippy -V
          cargo clippy --lib --examples --features aot,ffi -- -D warnings

      - name: Test Rust Bindings
        run: |
          cargo test --workspace --exclude async-wasi --locked --features aot,ffi -- --nocapture --test-threads=1

  build_windows:
    name: Windows
    runs-on: windows-2022
    strategy:
      matrix:
        rust: [stable]
    env:
      WASMEDGE_DIR: ${{ github.workspace }}\WasmEdge
      WASMEDGE_BUILD_DIR: ${{ github.workspace }}\WasmEdge\build
      WASMEDGE_PLUGIN_PATH: ${{ github.workspace }}\WasmEdge\build\wasmedge\plugins\wasmedge_process
      LD_LIBRARY_PATH: ${{ github.workspace }}\WasmEdge\build\lib\api
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout WasmEdge Runtime
        uses: actions/checkout@v7
        with:
          repository: WasmEdge/WasmEdge
          path: WasmEdge

      - name: Install dependency
        uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: install cmake ninja vswhere

      - name: Build WasmEdge with Release mode
        working-directory: WasmEdge
        run: |
          $vsPath = (vswhere -latest -property installationPath)
          Import-Module (Join-Path $vsPath "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64 -winsdk=10.0.19041.0"
          $llvm = "LLVM-13.0.1-win64.zip"
          curl -sLO https://github.com/WasmEdge/llvm-windows/releases/download/llvmorg-13.0.1/LLVM-13.0.1-win64.zip -o $llvm
          Expand-Archive -Path $llvm
          $llvm_dir = "$pwd\\LLVM-13.0.1-win64\\LLVM-13.0.1-win64\\lib\\cmake\\llvm"
          $Env:CC = "clang-cl"
          $Env:CXX = "clang-cl"
          $cmake_sys_version = "10.0.19041.0"
          cmake -Bbuild -GNinja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_SYSTEM_VERSION=$cmake_sys_version" -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL "-DLLVM_DIR=$llvm_dir" -DWASMEDGE_BUILD_PACKAGE="ZIP" .
          cmake --build build

      - name: Install Rust-stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          toolchain: ${{ matrix.rust }}

      - name: Rustfmt
        run: |
          rustup toolchain install ${{ env.RUSTFMT_TOOLCHAIN }} --profile minimal --component rustfmt
          cargo +${{ env.RUSTFMT_TOOLCHAIN }} fmt --all -- --check

      - name: Clippy
        run: |
          $vsPath = (vswhere -latest -property installationPath)
          Import-Module (Join-Path $vsPath "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64 -winsdk=10.0.19041.0"
          cargo clippy -V
          cargo clippy --lib --examples --features aot,ffi -- -D warnings

      - name: Test Rust Bindings
        run: |
          $vsPath = (vswhere -latest -property installationPath)
          Import-Module (Join-Path $vsPath "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64 -winsdk=10.0.19041.0"
          $env:Path="$env:Path;C:\Users\runneradmin\.rustup\toolchains\stable-x86_64-pc-windows-msvc\bin;D:\a\wasmedge-rust-sdk\wasmedge-rust-sdk\WasmEdge\build\lib\api"
          cargo test --workspace --exclude async-wasi --features aot,ffi --locked -- --nocapture --test-threads=1
