name: Release crates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the release without publishing or deploying documentation"
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  # Pinned so the OIDC-enabled publish job never executes unreviewed remote code.
  WASMEDGE_INSTALLER: https://raw.githubusercontent.com/WasmEdge/WasmEdge/678e63744c8a774eb68695f6c496c4bcf802f850/utils/install_v2.sh

jobs:
  resolve_release_set:
    name: Resolve release set
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      WORKFLOW_REF: ${{ github.ref }}
    outputs:
      crates: ${{ steps.resolve.outputs.crates }}
      crates_macos: ${{ steps.resolve.outputs.crates_macos }}
      has_macos_work: ${{ steps.resolve.outputs.has_macos_work }}
      wasmedge_version: ${{ steps.wasmedge.outputs.version }}

    steps:
      - name: Validate workflow ref
        shell: bash
        run: |
          if [[ "${DRY_RUN}" == "false" && "${WORKFLOW_REF}" != "refs/heads/main" ]]; then
            echo "::error::Publishing is only allowed from the main branch."
            exit 1
          fi

      - name: Checkout WasmEdge Rust SDK
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust-stable
        uses: dtolnay/rust-toolchain@stable

      - name: Require cargo with workspace publishing
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo --version | awk '{print $2}')
          if [[ "$(printf '%s\n1.90.0\n' "${version}" | sort -V | head -1)" != "1.90.0" ]]; then
            echo "::error::cargo >= 1.90 is required for \`cargo publish\` workspace support; found ${version}."
            exit 1
          fi
          echo "cargo ${version}"

      # Single source of truth for the native library version, so the workflow
      # cannot drift from what wasmedge-sys actually builds against.
      - name: Resolve the WasmEdge library version
        id: wasmedge
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^const WASMEDGE_RELEASE_VERSION: &str = "\(.*\)";$/\1/p' \
            crates/wasmedge-sys/build.rs)
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not parse WASMEDGE_RELEASE_VERSION from crates/wasmedge-sys/build.rs."
            exit 1
          fi
          echo "WasmEdge library version: ${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      # A crate is releasable exactly when its local version is not on crates.io
      # yet. `cargo publish --dry-run` cannot tell us this -- it aborts right
      # before the upload and never asks the registry -- so ask directly, and let
      # the answer decide what gets published instead of trusting a checkbox.
      - name: Resolve which crates need publishing
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          metadata=$(cargo metadata --no-deps --format-version 1)
          crates=""
          crates_macos=""

          while IFS=$'\t' read -r crate local_version; do
            if ! http_code=$(curl -sS --retry 3 -o /tmp/crates-io.json -w '%{http_code}' \
              -H 'User-Agent: wasmedge-rust-sdk release CI (https://github.com/WasmEdge/wasmedge-rust-sdk)' \
              "https://crates.io/api/v1/crates/${crate}"); then
              echo "::error::Could not reach crates.io while checking ${crate}."
              exit 1
            fi

            case "${http_code}" in
              200)
                if jq -e --arg v "${local_version}" \
                  '.versions[]? | select(.num == $v)' /tmp/crates-io.json >/dev/null; then
                  echo "  ${crate} ${local_version} -- already published, skipping"
                  continue
                fi
                ;;
              404) ;;
              *)
                echo "::error::crates.io returned HTTP ${http_code} for ${crate}."
                exit 1
                ;;
            esac

            echo "  ${crate} ${local_version} -- to be published"
            crates="${crates} ${crate}"

            # async-wasi calls socket2 APIs that only exist on Linux, so it cannot
            # be verified on macOS. The workspace normally hides this because
            # async-wasi is only a dependency under cfg(target_os = "linux").
            if [[ "${crate}" != "async-wasi" ]]; then
              crates_macos="${crates_macos} ${crate}"
            fi
          done < <(jq -r '.packages[] | [.name, .version] | @tsv' <<<"${metadata}")

          crates="${crates# }"
          crates_macos="${crates_macos# }"

          if [[ -z "${crates}" ]]; then
            echo "::error::Every crate is already published at its current version. Bump something before releasing."
            exit 1
          fi

          echo "Release set: ${crates}"
          echo "crates=${crates}" >> "${GITHUB_OUTPUT}"
          echo "crates_macos=${crates_macos}" >> "${GITHUB_OUTPUT}"
          if [[ -n "${crates_macos}" ]]; then
            echo "has_macos_work=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_macos_work=false" >> "${GITHUB_OUTPUT}"
          fi

  verify_linux:
    name: Verify release (Linux)
    needs: resolve_release_set
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    container:
      image: wasmedge/wasmedge:ubuntu-build-clang
    env:
      RELEASE_CRATES: ${{ needs.resolve_release_set.outputs.crates }}
      WASMEDGE_VERSION: ${{ needs.resolve_release_set.outputs.wasmedge_version }}

    steps:
      - name: Checkout WasmEdge Rust SDK
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up build environment
        run: |
          apt update
          apt install -y software-properties-common libboost-all-dev ninja-build
          apt install -y llvm-15-dev liblld-15-dev

      - name: Install WasmEdge
        run: |
          curl -sSfL --retry 3 --output /tmp/wasmedge-install.sh "${WASMEDGE_INSTALLER}"
          bash /tmp/wasmedge-install.sh -v "${WASMEDGE_VERSION}" -p /usr/local
          ldconfig
          /usr/local/bin/wasmedge --version

      - name: Install Rust-stable
        uses: dtolnay/rust-toolchain@stable

      # `cargo publish` builds every crate in the release set against a temporary
      # registry overlay holding the others, so each one is verified as if its
      # siblings were already on crates.io. Nothing is uploaded here.
      - name: Verify the release set
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for crate in ${RELEASE_CRATES}; do
            args+=(-p "${crate}")
          done
          cargo publish "${args[@]}" --dry-run

  verify_macos:
    name: Verify release (macOS arm64)
    needs: resolve_release_set
    if: needs.resolve_release_set.outputs.has_macos_work == 'true'
    runs-on: macos-15
    permissions:
      contents: read
    env:
      RELEASE_CRATES: ${{ needs.resolve_release_set.outputs.crates_macos }}
      WASMEDGE_VERSION: ${{ needs.resolve_release_set.outputs.wasmedge_version }}

    steps:
      - name: Checkout WasmEdge Rust SDK
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install WasmEdge
        run: |
          curl -sSfL --retry 3 --output /tmp/wasmedge-install.sh "${WASMEDGE_INSTALLER}"
          bash /tmp/wasmedge-install.sh -v "${WASMEDGE_VERSION}" -p "$HOME/.wasmedge"
          "$HOME/.wasmedge/bin/wasmedge" --version
          echo "WASMEDGE_DIR=$HOME/.wasmedge" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$HOME/.wasmedge/lib" >> "$GITHUB_ENV"
          echo "$HOME/.wasmedge/bin" >> "$GITHUB_PATH"

      - name: Install Rust-stable
        uses: dtolnay/rust-toolchain@stable

      - name: Verify the release set
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for crate in ${RELEASE_CRATES}; do
            args+=(-p "${crate}")
          done
          cargo publish "${args[@]}" --dry-run

  publish:
    name: Publish to crates.io
    needs:
      - resolve_release_set
      - verify_linux
      - verify_macos
    if: >-
      ${{
        always() &&
        !cancelled() &&
        inputs.dry_run == false &&
        github.ref == 'refs/heads/main' &&
        needs.resolve_release_set.result == 'success' &&
        needs.verify_linux.result == 'success' &&
        (needs.verify_macos.result == 'success' || needs.verify_macos.result == 'skipped')
      }}
    runs-on: ubuntu-22.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    container:
      image: wasmedge/wasmedge:ubuntu-build-clang@sha256:a5cacfd0cd2d9ff2ba28f6581ab7dff3e4053145556f7e99b05249e9b7323d5b
    env:
      RELEASE_CRATES: ${{ needs.resolve_release_set.outputs.crates }}
      WASMEDGE_VERSION: ${{ needs.resolve_release_set.outputs.wasmedge_version }}

    steps:
      - name: Checkout WasmEdge Rust SDK
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up build environment
        run: |
          apt update
          apt install -y software-properties-common libboost-all-dev ninja-build
          apt install -y llvm-15-dev liblld-15-dev

      - name: Install WasmEdge
        run: |
          curl -sSfL --retry 3 --output /tmp/wasmedge-install.sh "${WASMEDGE_INSTALLER}"
          bash /tmp/wasmedge-install.sh -v "${WASMEDGE_VERSION}" -p /usr/local
          ldconfig
          /usr/local/bin/wasmedge --version

      - name: Install Rust-stable
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # Uploads are not atomic: a server, network or rate-limit error can leave
      # the set partially published. Verification already ran across the whole
      # set, so re-running this workflow to publish the remaining crates is safe.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for crate in ${RELEASE_CRATES}; do
            args+=(-p "${crate}")
          done
          cargo publish "${args[@]}"

  api_document:
    name: API document
    needs:
      - resolve_release_set
      - verify_linux
      - publish
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.resolve_release_set.result == 'success' &&
        needs.verify_linux.result == 'success' &&
        (needs.publish.result == 'success' || needs.publish.result == 'skipped')
      }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    container:
      image: wasmedge/wasmedge:ubuntu-build-clang
    env:
      WASMEDGE_VERSION: ${{ needs.resolve_release_set.outputs.wasmedge_version }}

    steps:
      - name: Checkout WasmEdge Rust SDK
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up build environment
        run: |
          apt update
          apt install -y software-properties-common libboost-all-dev ninja-build
          apt install -y llvm-15-dev liblld-15-dev

      - name: Install WasmEdge
        run: |
          curl -sSfL --retry 3 --output /tmp/wasmedge-install.sh "${WASMEDGE_INSTALLER}"
          bash /tmp/wasmedge-install.sh -v "${WASMEDGE_VERSION}" -p /usr/local
          ldconfig
          /usr/local/bin/wasmedge --version

      # must use nightly, because of the feature `doc_cfg`
      - name: Install Rust-nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Build API document
        run: |
          RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc -p wasmedge-sdk --workspace --no-deps --features aot,wasi_crypto,wasi_nn,wasmedge_process,ffi --target-dir=./target

      - name: Deploy API document
        if: github.ref == 'refs/heads/main' && inputs.dry_run == false && needs.publish.result == 'success'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/doc
          force_orphan: true
