name: Release crates

on:
  workflow_dispatch:
    inputs:
      release_async_wasi:
        description: "Release async-wasi"
        required: true
        default: false
        type: boolean
      release_wasmedge_macro:
        description: "Release wasmedge-macro"
        required: true
        default: false
        type: boolean
      release_wasmedge_types:
        description: "Release wasmedge-types"
        required: true
        default: false
        type: boolean
      release_wasmedge_sys:
        description: "Release wasmedge-sys"
        required: true
        default: false
        type: boolean
      release_wasmedge_sdk:
        description: "Release wasmedge-sdk"
        required: true
        default: false
        type: boolean
      wasmedge_version:
        description: "WasmEdge version (required for wasmedge-sys or wasmedge-sdk)"
        required: false
        type: string
      dry_run:
        description: "Validate selected releases without publishing or deploying documentation"
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate_inputs:
    name: Validate release inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      RELEASE_ASYNC_WASI: ${{ inputs.release_async_wasi }}
      RELEASE_WASMEDGE_MACRO: ${{ inputs.release_wasmedge_macro }}
      RELEASE_WASMEDGE_TYPES: ${{ inputs.release_wasmedge_types }}
      RELEASE_WASMEDGE_SYS: ${{ inputs.release_wasmedge_sys }}
      RELEASE_WASMEDGE_SDK: ${{ inputs.release_wasmedge_sdk }}
      WASMEDGE_VERSION: ${{ inputs.wasmedge_version }}
      WORKFLOW_REF: ${{ github.ref }}

    steps:
      - name: Validate selection and version
        shell: bash
        run: |
          if [[ "${RELEASE_ASYNC_WASI}" != "true" \
            && "${RELEASE_WASMEDGE_MACRO}" != "true" \
            && "${RELEASE_WASMEDGE_TYPES}" != "true" \
            && "${RELEASE_WASMEDGE_SYS}" != "true" \
            && "${RELEASE_WASMEDGE_SDK}" != "true" ]]; then
            echo "::error::Select at least one crate to release."
            exit 1
          fi

          if [[ ("${RELEASE_WASMEDGE_SYS}" == "true" || "${RELEASE_WASMEDGE_SDK}" == "true") \
            && -z "${WASMEDGE_VERSION}" ]]; then
            echo "::error::wasmedge_version is required when releasing wasmedge-sys or wasmedge-sdk."
            exit 1
          fi

          if [[ "${DRY_RUN}" == "false" && "${WORKFLOW_REF}" != "refs/heads/main" ]]; then
            echo "::error::Publishing is only allowed from the main branch."
            exit 1
          fi

      - name: Checkout WasmEdge Rust SDK
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust-stable
        uses: dtolnay/rust-toolchain@stable

      # `cargo publish --dry-run` never contacts the registry to check whether
      # the version already exists -- it aborts right before the upload -- so a
      # fully green dry run says nothing about whether these versions are
      # actually publishable. Ask crates.io directly.
      - name: Reject versions already published on crates.io
        shell: bash
        run: |
          set -euo pipefail

          metadata=$(cargo metadata --no-deps --format-version 1)
          failed=0

          for entry in \
            "async-wasi:${RELEASE_ASYNC_WASI}" \
            "wasmedge-macro:${RELEASE_WASMEDGE_MACRO}" \
            "wasmedge-types:${RELEASE_WASMEDGE_TYPES}" \
            "wasmedge-sys:${RELEASE_WASMEDGE_SYS}" \
            "wasmedge-sdk:${RELEASE_WASMEDGE_SDK}"; do
            crate="${entry%%:*}"
            [[ "${entry##*:}" == "true" ]] || continue

            local_version=$(jq -r --arg c "${crate}" \
              '.packages[] | select(.name == $c) | .version' <<<"${metadata}")
            if [[ -z "${local_version}" ]]; then
              echo "::error::Could not read the local version of ${crate}."
              failed=1
              continue
            fi

            if ! http_code=$(curl -sS --retry 3 -o /tmp/crates-io.json -w '%{http_code}' \
              -H 'User-Agent: wasmedge-rust-sdk release CI (https://github.com/WasmEdge/wasmedge-rust-sdk)' \
              "https://crates.io/api/v1/crates/${crate}"); then
              echo "::error::Could not reach crates.io while checking ${crate}."
              failed=1
              continue
            fi

            case "${http_code}" in
              200) ;;
              404)
                echo "${crate} has never been published; ${local_version} is free."
                continue
                ;;
              *)
                echo "::error::crates.io returned HTTP ${http_code} for ${crate}."
                failed=1
                continue
                ;;
            esac

            if jq -e --arg v "${local_version}" \
              '.versions[]? | select(.num == $v)' /tmp/crates-io.json >/dev/null; then
              echo "::error::${crate} ${local_version} is already published on crates.io. Bump the version in its Cargo.toml before releasing."
              failed=1
            else
              echo "${crate} ${local_version} is not on crates.io yet."
            fi
          done

          exit "${failed}"

  release_async_wasi:
    name: Release async-wasi
    needs: validate_inputs
    if: inputs.release_async_wasi
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-async-wasi.yml
    with:
      dry_run: ${{ inputs.dry_run }}

  release_wasmedge_macro:
    name: Release wasmedge-macro
    needs: validate_inputs
    if: inputs.release_wasmedge_macro
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-wasmedge-macro.yml
    with:
      dry_run: ${{ inputs.dry_run }}

  release_wasmedge_types:
    name: Release wasmedge-types
    needs: validate_inputs
    if: inputs.release_wasmedge_types
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-wasmedge-types.yml
    with:
      dry_run: ${{ inputs.dry_run }}

  release_wasmedge_sys:
    name: Release wasmedge-sys
    needs:
      - validate_inputs
      - release_async_wasi
      - release_wasmedge_macro
      - release_wasmedge_types
    if: >-
      ${{
        always() &&
        !cancelled() &&
        inputs.release_wasmedge_sys &&
        needs.validate_inputs.result == 'success' &&
        (needs.release_async_wasi.result == 'success' || needs.release_async_wasi.result == 'skipped') &&
        (needs.release_wasmedge_macro.result == 'success' || needs.release_wasmedge_macro.result == 'skipped') &&
        (needs.release_wasmedge_types.result == 'success' || needs.release_wasmedge_types.result == 'skipped')
      }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-wasmedge-sys.yml
    with:
      wasmedge_version: ${{ inputs.wasmedge_version }}
      dry_run: ${{ inputs.dry_run }}

  release_wasmedge_sdk:
    name: Release wasmedge-sdk
    needs:
      - validate_inputs
      - release_async_wasi
      - release_wasmedge_macro
      - release_wasmedge_types
      - release_wasmedge_sys
    if: >-
      ${{
        always() &&
        !cancelled() &&
        inputs.release_wasmedge_sdk &&
        needs.validate_inputs.result == 'success' &&
        (needs.release_async_wasi.result == 'success' || needs.release_async_wasi.result == 'skipped') &&
        (needs.release_wasmedge_macro.result == 'success' || needs.release_wasmedge_macro.result == 'skipped') &&
        (needs.release_wasmedge_types.result == 'success' || needs.release_wasmedge_types.result == 'skipped') &&
        (needs.release_wasmedge_sys.result == 'success' || needs.release_wasmedge_sys.result == 'skipped')
      }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-wasmedge-sdk.yml
    with:
      wasmedge_version: ${{ inputs.wasmedge_version }}
      dry_run: ${{ inputs.dry_run }}

  deploy_api_document:
    name: Deploy API document
    needs: release_wasmedge_sdk
    if: >-
      ${{
        always() &&
        !cancelled() &&
        github.ref == 'refs/heads/main' &&
        inputs.release_wasmedge_sdk &&
        inputs.dry_run == false &&
        needs.release_wasmedge_sdk.result == 'success'
      }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download API document
        uses: actions/download-artifact@v8
        with:
          name: wasmedge-sdk-api-docs
          path: target/doc

      - name: Deploy API document
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/doc
          force_orphan: true
