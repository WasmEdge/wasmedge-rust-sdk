name: Continuous integration with the release version of Wasmedge

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  WASMEDGE_VERSION: "0.17.1"
  # WasmEdge/WasmEdge doesn't publish install_v2.sh support for Windows (the
  # script hard-errors on Windows_NT/MinGW), so the Windows job still builds
  # WasmEdge from source. Pinning the LLVM archive here keeps that one-off
  # build recipe bumpable without touching the PowerShell script below.
  WINDOWS_LLVM_URL: "https://github.com/WasmEdge/llvm-windows/releases/download/llvmorg-17.0.6/LLVM-17.0.6-win64-MultiThreadedDLL.zip"

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/workflows/standalone.yml"
      - ".github/workflows/rust-static-lib.yml"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".github/workflows/standalone.yml"
      - ".github/workflows/rust-static-lib.yml"

permissions:
  contents: read

jobs:
  build_ubuntu:
    name: Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        rust: [stable]
    container:
      image: wasmedge/wasmedge:ubuntu-build-clang

    steps:
      - name: Checkout WasmEdge Rust SDK
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install WasmEdge
        run: |
          curl -sSfL --retry 3 --output /tmp/wasmedge-install.sh \
            https://raw.githubusercontent.com/WasmEdge/WasmEdge/master/utils/install_v2.sh
          bash /tmp/wasmedge-install.sh -v "${WASMEDGE_VERSION}" -p "$HOME/.wasmedge"
          "$HOME/.wasmedge/bin/wasmedge" --version
          ldconfig

      - name: Install Rust-stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy check
        run: |
          cargo clippy -V
          cargo clippy --lib --examples --features aot,wasi_nn,wasmedge_process,ffi -- -D warnings

      - name: Clippy check for async feature
        run: |
          cargo clippy -V
          cargo clippy --lib --examples --features aot,async,wasi_nn,wasmedge_process,ffi -- -D warnings

      - name: Build Async-Hello for Testing
        working-directory: examples/wasmedge-sys
        run: |
          rustup target add wasm32-wasip1
          rustc async_hello.rs --target=wasm32-wasip1 -o async_hello.wasm
          rustc hello.rs --target=wasm32-wasip1 -o hello.wasm

      - name: Test Rust SDK
        run: |
          export LD_LIBRARY_PATH="/github/home/.wasmedge/lib"
          cargo test --workspace --locked --features aot,wasmedge_process,ffi -- --nocapture --test-threads=1 --skip test_vmbuilder

      - name: Test Rust SDK with async feature
        run: |
          export LD_LIBRARY_PATH="/github/home/.wasmedge/lib"
          cargo test --workspace --locked --features aot,async,wasmedge_process,ffi -- --nocapture --test-threads=1 --skip test_vmbuilder

  build_macos:
    name: macOS arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [macos-15]
        rust: [stable]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install WasmEdge
        run: |
          curl -sSfL --retry 3 --output /tmp/wasmedge-install.sh \
            https://raw.githubusercontent.com/WasmEdge/WasmEdge/master/utils/install_v2.sh
          bash /tmp/wasmedge-install.sh -v "${WASMEDGE_VERSION}" -p "$HOME/.wasmedge"
          "$HOME/.wasmedge/bin/wasmedge" --version
      - name: Install Rust-stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: |
          cargo clippy -V
          cargo clippy --lib --examples --features aot,ffi -- -D warnings

      - name: Test Rust Bindings
        run: |
          export DYLD_LIBRARY_PATH="/Users/runner/.wasmedge/lib"
          cargo test --workspace --exclude async-wasi --locked --features aot,ffi -- --nocapture --test-threads=1

  build_windows:
    name: Windows
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      matrix:
        rust: [stable]
    env:
      WASMEDGE_DIR: ${{ github.workspace }}\WasmEdge
      WASMEDGE_BUILD_DIR: ${{ github.workspace }}\WasmEdge\build
      WASMEDGE_PLUGIN_PATH: ${{ github.workspace }}\WasmEdge\build\wasmedge\plugins\wasmedge_process
      LD_LIBRARY_PATH: ${{ github.workspace }}\WasmEdge\build\lib\api
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout WasmEdge Runtime
        uses: actions/checkout@v7
        with:
          repository: WasmEdge/WasmEdge
          path: WasmEdge
          fetch-depth: 0

      - name: Install dependency
        uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: install cmake ninja vswhere

      - name: Build WasmEdge with Release mode
        working-directory: WasmEdge
        run: |
          # Pin to the exact release tag this workflow already targets via
          # env.WASMEDGE_VERSION (matches the other jobs' `-v` install_v2.sh
          # argument), rather than guessing "whatever tag sorts first". The
          # regex only filters the candidate list for a readable error if the
          # pin doesn't exist as a tag.
          $releaseTags = git tag -l --sort=-version:refname | Where-Object { $_ -match '^\d+\.\d+\.\d+$' }
          if ($releaseTags -notcontains $env:WASMEDGE_VERSION) {
            Write-Error "WasmEdge tag '$env:WASMEDGE_VERSION' (env.WASMEDGE_VERSION) not found in WasmEdge/WasmEdge release tags: $($releaseTags -join ', ')"
            exit 1
          }
          git checkout $env:WASMEDGE_VERSION

          $vsPath = (vswhere -latest -property installationPath)
          Import-Module (Join-Path $vsPath "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64 -winsdk=10.0.19041.0"

          # LLVM archive URL/version lives in env.WINDOWS_LLVM_URL (workflow
          # env block) so bumping it doesn't require touching this script.
          # The extraction dir is searched rather than hardcoded, since the
          # zip's internal top-level folder name doesn't always match the
          # archive's own file name.
          $llvm = [System.IO.Path]::GetFileName($env:WINDOWS_LLVM_URL)
          curl -sSfL --retry 3 -o $llvm $env:WINDOWS_LLVM_URL
          $llvmExtractDir = [System.IO.Path]::GetFileNameWithoutExtension($llvm)
          Expand-Archive -Path $llvm -DestinationPath $llvmExtractDir
          $llvm_dir = (Get-ChildItem -Path $llvmExtractDir -Recurse -Directory -Filter "llvm" |
            Where-Object { $_.FullName -match '\\cmake\\llvm$' } |
            Select-Object -First 1).FullName
          if (-not $llvm_dir) {
            Write-Error "Could not locate lib/cmake/llvm under extracted archive $llvmExtractDir"
            exit 1
          }

          $Env:CC = "clang-cl"
          $Env:CXX = "clang-cl"
          $cmake_sys_version = "10.0.19041.0"
          cmake -Bbuild -GNinja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_SYSTEM_VERSION=$cmake_sys_version" -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL "-DLLVM_DIR=$llvm_dir" -DWASMEDGE_BUILD_PACKAGE="ZIP" .
          cmake --build build

      - name: Install Rust-stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: |
          $vsPath = (vswhere -latest -property installationPath)
          Import-Module (Join-Path $vsPath "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64 -winsdk=10.0.19041.0"
          cargo clippy -V
          cargo clippy --lib --examples --features aot,ffi -- -D warnings

      - name: Test Rust Bindings
        run: |
          $vsPath = (vswhere -latest -property installationPath)
          Import-Module (Join-Path $vsPath "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64 -winsdk=10.0.19041.0"
          $env:Path="$env:Path;C:\Users\runneradmin\.rustup\toolchains\stable-x86_64-pc-windows-msvc\bin;D:\a\wasmedge-rust-sdk\wasmedge-rust-sdk\WasmEdge\build\lib\api"
          cargo test --workspace --exclude async-wasi --features aot,ffi --locked -- --nocapture --test-threads=1
