name: Release wasmedge-macro crate

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the release without publishing"
        required: true
        default: true
        type: boolean

jobs:
  validate_macos_arm64:
    name: Validate macOS arm64
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Checkout WasmEdge Rust SDK
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust-stable
        uses: dtolnay/rust-toolchain@stable

      - name: Dry run cargo publish
        run: cargo publish --dry-run -p wasmedge-macro

  release_wasmedge_macro:
    name: Release wasmedge-macro crate
    needs: validate_macos_arm64
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    container:
      image: wasmedge/wasmedge:ubuntu-build-clang

    steps:
      - name: Checkout WasmEdge Rust SDK
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust-stable
        uses: dtolnay/rust-toolchain@stable

      - name: Dry run cargo publish
        shell: bash
        run: |
          cargo publish --dry-run -p wasmedge-macro

      - name: Publish
        if: github.ref == 'refs/heads/main' && inputs.dry_run == false
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRIES_MACRO_TOKEN }}
        shell: bash
        run: |
          cargo publish -p wasmedge-macro
