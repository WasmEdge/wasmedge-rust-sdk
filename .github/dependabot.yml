# Set update schedule for cargo and GitHub Actions dependencies.
#
# Commit-message prefix follows WasmEdge/WasmEdge's own dependabot.yml
# convention (github.com/WasmEdge/WasmEdge/blob/master/.github/dependabot.yml).

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      # Check for updates to Cargo dependencies every week.
      interval: "weekly"
    commit-message:
      # Prefix for PR title and commit messages.
      prefix: "ci(dependabot):"
    groups:
      # Group all minor/patch bumps into a single PR; major bumps (more
      # likely to need a semver-checks/API review) still get their own PR.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week.
      interval: "weekly"
    commit-message:
      # Prefix for PR title and commit messages.
      prefix: "ci(dependabot):"
    groups:
      # Group updates; actions that match are grouped into a single PR,
      # dependabot still raises a PR for each of the remaining actions.
      upload-and-download-artifact:
        patterns:
          - "*load-artifact"
