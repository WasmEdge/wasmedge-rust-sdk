[package]
categories = ["development-tools::procedural-macro-helpers", "wasm"]
description = "The procedural macros for WasmEdge Rust bindings."
documentation = "https://docs.rs/wasmedge-macro"
edition.workspace = true
keywords = ["wasmedge", "wasm", "webassembly", "macro", "proc-macro"]
license.workspace = true
name = "wasmedge-macro"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version = "0.6.1"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.43"
quote = "1"
syn = { version = "2", features = ["full"] }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
