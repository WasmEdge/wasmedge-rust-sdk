[package]
categories = ["wasm"]
description = "Async WASI for WasmEdge"
documentation = "https://docs.rs/async-wasi/"
edition.workspace = true
license.workspace = true
name = "async-wasi"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version = "0.2.1"

[dependencies]
log.workspace = true
bitflags.workspace = true
cfg-if.workspace = true
futures.workspace = true
getrandom.workspace = true
libc.workspace = true
path-absolutize = "3.0.13"
slab.workspace = true

[target.'cfg(unix)'.dependencies]
socket2 = { workspace = true, features = ["all"] }
tokio = { workspace = true, features = [
    "net",
    "time",
    "io-util",
    "macros",
    "sync",
], optional = true }

# Test-only: the async socket tests need a Tokio runtime (`AsyncFd`, timers).
# The library itself never enables `rt`; the embedder provides the runtime.
[target.'cfg(unix)'.dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }

[features]
async_tokio = ["tokio"]
default = ["async_tokio"]

[lints]
workspace = true
