# Only options that differ from rustfmt's own defaults belong here.
#
# format_macro_matchers and imports_granularity are nightly-only, so the
# formatting gate has to run on a nightly rustfmt to enforce them; stable
# rustfmt ignores unstable options with a warning and still exits 0.

edition = "2021"
style_edition = "2015"
format_macro_matchers = true
imports_granularity = "Crate"
